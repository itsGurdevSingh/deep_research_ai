services:
  - type: web
    name: deep-research-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    buildFilter:
      paths:
        - backend/**
        - pipeline.py
        - agents.py
        - tools.py
        - requirements.txt
        - render.yaml
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
